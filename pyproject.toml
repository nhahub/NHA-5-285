[project]
name = "agentic-review"
version = "0.1.0"
description = "A local CLI that reviews a TypeScript/JavaScript change set and emits schema-validated findings."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "langchain-core",
    "langchain-openai",
    "langgraph",
]

[project.scripts]
agentic-review = "agentic_review.cli.app:main"

[dependency-groups]
dev = [
    "pytest",
    "import-linter",
    "jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# Structural contracts (technical_stack.md §4, research R-20). Contracts 4 and 5 arrive with feature 004.
[tool.importlinter]
root_package = "agentic_review"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1 - only core.output and cli may import Rich"
type = "forbidden"
source_modules = [
    "agentic_review.core.pipeline",
    "agentic_review.core.changeset",
    "agentic_review.core.assembly",
    "agentic_review.core.findings",
    "agentic_review.core.agent",
    "agentic_review.core.config",
]
forbidden_modules = ["rich"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "2 - only core.changeset may import the git layer"
type = "forbidden"
source_modules = [
    "agentic_review.cli",
    "agentic_review.core.pipeline",
    "agentic_review.core.assembly",
    "agentic_review.core.findings",
    "agentic_review.core.agent",
    "agentic_review.core.output",
    "agentic_review.core.config",
]
forbidden_modules = ["agentic_review.core.changeset._git"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "3 - no core-function package may import LangChain, LangGraph or openai"
type = "forbidden"
source_modules = [
    "agentic_review.cli",
    "agentic_review.core.changeset",
    "agentic_review.core.assembly",
    "agentic_review.core.findings",
    "agentic_review.core.output",
    "agentic_review.core.config",
]
forbidden_modules = ["langchain_core", "langchain_openai", "langgraph", "openai"]
allow_indirect_imports = true

# ADR-0009 lets the orchestrator declare its order as a graph. It does not let the provider client leave CF-6,
# so core.pipeline gets LangGraph and nothing else.
[[tool.importlinter.contracts]]
name = "3b - core.pipeline may import LangGraph, but never a provider client"
type = "forbidden"
source_modules = ["agentic_review.core.pipeline"]
forbidden_modules = ["langchain_core", "langchain_openai", "openai"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "6 - layers: nothing imports cli; capabilities do not import each other"
type = "layers"
layers = [
    "agentic_review.cli",
    "agentic_review.core.pipeline",
    "agentic_review.core.agent",
    "agentic_review.core.assembly | agentic_review.core.output",
    "agentic_review.core.changeset",
    "agentic_review.core.findings | agentic_review.core.config",
]
