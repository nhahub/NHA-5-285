name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      # Structural contracts 1, 2, 3, 6 (FR-030)
      - run: uv run lint-imports
      # Offline suite: no secrets, network blocked by tests/conftest.py (SC-006)
      - run: uv run pytest
